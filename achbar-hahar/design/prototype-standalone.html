document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\", stroke:\"currentColor\", strokeWidth:2, strokeLinecap:\"round\", strokeLinejoin:\"round\", style:{color} };\n    const sets = {\n      all:    [\"M3 5h7v6H3z\",\"M14 5h7v4h-7z\",\"M14 13h7v6h-7z\",\"M3 15h7v4H3z\"],\n      food:   [\"M5 9h9v4a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z\",\"M14 9h2a2 2 0 0 1 0 4h-2\",\"M8 2.5c.6 1 .6 2 0 3\",\"M11 2.5c.6 1 .6 2 0 3\"],\n      trail:  [\"M3 20l5-9 3.5 5L15 9l6 11z\",\"M14.5 9.5l1-1.8 1 1.8\"],\n      leaf:   [\"M20 4C10 4 4 10 4 20c10 0 16-6 16-16z\",\"M5 19C9 14 13 12 18 11\"],\n      biz:    [\"M4 8h16v11H4z\",\"M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2\",\"M4 13h16\"],\n      people: [\"M5.5 20a6.5 6.5 0 0 1 13 0\",\"M12 4a3.4 3.4 0 1 0 0 6.8A3.4 3.4 0 0 0 12 4z\"]\n    };\n    return R(\"svg\", c, (sets[name]||[]).map((d,i)=>R(\"path\",{d, key:i})));\n  }\n\n  matches(d){\n    const q = this.state.query.trim();\n    if(this.state.activeCat !== \"all\" && d.cat !== this.state.activeCat) return false;\n    if(!q) return true;\n    return (d.name+\" \"+d.sub+\" \"+d.settlement+\" \"+d.notes+\" \"+d.cat).includes(q);\n  }\n  navUrl(d){\n    if(d.lat !== \"\" && d.lng !== \"\" && d.lat != null && d.lng != null)\n      return \"https://www.google.com/maps/search/?api=1&query=\" + d.lat + \"%2C\" + d.lng;\n    const q = encodeURIComponent([d.name, d.settlement, \"רמת הגולן\"].filter(Boolean).join(\" \"));\n    return \"https://www.google.com/maps/search/?api=1&query=\" + q;\n  }\n\n  select(idx){\n    this.setState({ selected: idx }, () => {\n      if(!this.map) return;\n      const d = this.state.data[idx];\n      Object.keys(this.markers).forEach(i => this.markers[i].setIcon(this.pinIcon(this.CATS[this.state.data[i].cat].color, (+i) === idx)));\n      const m = this.markers[idx];\n      if(m){ if(d.lat !== \"\" && d.lng !== \"\") this.map.setView([d.lat, d.lng], Math.max(this.map.getZoom(), 13), {animate:true}); m.openPopup(); }\n    });\n  }\n\n  pinIcon(color, on){\n    return L.divIcon({ className:\"\", iconSize:[26,26], iconAnchor:[13,24], popupAnchor:[0,-22],\n      html:`<div class=\"achbar-pin\" style=\"background:${color};${on?\"transform:rotate(45deg) scale(1.28);border-color:#20302E;z-index:600\":\"\"}\"><\u002Fdiv>` });\n  }\n  initMap(){\n    if(this._mapInit) return true;\n    const el = document.getElementById(\"achbar-map\");\n    if(!el || !window.L) return false;\n    this._mapInit = true;\n    this.map = L.map(el, { scrollWheelZoom:true, zoomControl:true }).setView([33.10, 35.72], 11);\n    L.tileLayer(\"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png\",\n      { attribution:\"&copy; OpenStreetMap &copy; CARTO\", maxZoom:19, subdomains:\"abcd\" }).addTo(this.map);\n    this.renderMarkers();\n    setTimeout(()=>{ if(this.map) this.map.invalidateSize(); }, 200);\n    return true;\n  }\n  tryInitMap(n){ if(this.initMap()) return; if(n > 40) return; setTimeout(()=>this.tryInitMap(n+1), 150); }\n\n  renderMarkers(){\n    if(!this.map) return;\n    Object.values(this.markers).forEach(m => this.map.removeLayer(m));\n    this.markers = {};\n    const list = this.state.data.filter(d => this.matches(d) && d.lat !== \"\" && d.lng !== \"\");\n    const bounds = [];\n    list.forEach(d => {\n      const idx = this.state.data.indexOf(d);\n      const m = L.marker([d.lat, d.lng], { icon: this.pinIcon(this.CATS[d.cat].color, idx === this.state.selected) }).addTo(this.map);\n      m.bindPopup(`<div class=\"achbar-pop\"><b>${d.name}<\u002Fb><span>${[d.sub, d.settlement].filter(Boolean).join(\" · \")}<\u002Fspan><\u002Fdiv>`);\n      m.on(\"click\", () => this.select(idx));\n      this.markers[idx] = m; bounds.push([d.lat, d.lng]);\n    });\n    if(bounds.length) this.map.fitBounds(bounds, { padding:[40,40], maxZoom:13 });\n  }\n\n  loadSheet(){\n    const url = this.SHEET_CSV_URL;\n    if(!url || !window.Papa) return;\n    window.Papa.parse(url, { download:true, header:true, skipEmptyLines:true, complete:(res)=>{\n      const rows = (res.data||[])\n        .filter(r => (r.name||\"\").trim() && (!r.status || r.status.trim().toLowerCase()===\"approved\"))\n        .map(r => ({ name:(r.name||\"\").trim(), cat:(r.cat||\"\").trim(), sub:(r.sub||\"\").trim(),\n          settlement:(r.settlement||\"\").trim(), phone:(r.phone||\"\").trim(), notes:(r.notes||\"\").trim(),\n          lat:(r.lat!==\"\"&&r.lat!=null)?parseFloat(r.lat):\"\", lng:(r.lng!==\"\"&&r.lng!=null)?parseFloat(r.lng):\"\" }))\n        .filter(r => this.CATS[r.cat]);\n      if(rows.length) this.setState({ data: rows }, () => this.renderMarkers());\n    }, error:()=>{} });\n  }\n\n  cardVM(d, density){\n    const idx = this.state.data.indexOf(d);\n    const color = this.CATS[d.cat].color;\n    const sel = idx === this.state.selected;\n    const meta = [d.sub, d.settlement].filter(Boolean).join(\" · \");\n    const showNav = d.cat !== \"אנשי קשר\";\n    return {\n      idx, name:d.name, color, catLabel:d.cat, meta, notes:d.notes||\"\",\n      phone:d.phone||\"\", phoneHref: d.phone ? (\"tel:\"+d.phone.replace(/[^0-9+]/g,\"\")) : \"\",\n      showNav, navUrl: showNav ? this.navUrl(d) : \"\",\n      hasActions: !!(d.phone || showNav),\n      pad: density === \"compact\" ? \"13px 15px 13px 17px\" : \"16px 18px 16px 20px\",\n      borderColor: sel ? color : \"rgba(31,42,42,.12)\",\n      boxShadow: sel\n        ? (\"0 0 0 2px \"+color+\" inset, 0 8px 24px rgba(31,42,42,.1)\")\n        : \"0 1px 2px rgba(31,42,42,.05), 0 6px 18px rgba(31,42,42,.06)\",\n      hover: \"transform:translateY(-2px);border-color:\"+color,\n      onClick: (e) => { if(e && e.target && e.target.closest && e.target.closest(\"a\")) return; this.select(idx); }\n    };\n  }\n\n  renderVals(){\n    const density = this.props.density || \"comfortable\";\n    const showMap = this.props.showMap !== false;\n    const q = this.state.query.trim();\n    const active = this.state.activeCat;\n    const order = Object.keys(this.CATS);\n\n    // counts per category (respecting search, ignoring active filter)\n    const searchOnly = this.state.data.filter(d => !q || (d.name+\" \"+d.sub+\" \"+d.settlement+\" \"+d.notes+\" \"+d.cat).includes(q));\n    const count = name => name === \"all\" ? searchOnly.length : searchOnly.filter(d => d.cat === name).length;\n\n    const mkChip = (id, label, color, iconName) => {\n      const isActive = active === id;\n      return {\n        label, count: count(id), onClick: () => this.setState({ activeCat:id, selected:null }),\n        icon: this.icon(iconName, isActive ? color : color),\n        bg: isActive ? \"#20302E\" : \"#FBF8F0\",\n        fg: isActive ? \"#F3EEE2\" : \"#21282A\",\n        border: isActive ? \"#20302E\" : \"rgba(31,42,42,.12)\",\n        iconColor: isActive ? color : color,\n        cntColor: isActive ? \"#9FA8A2\" : \"#5A6562\",\n        hover: isActive ? \"\" : (\"border-color:\"+color)\n      };\n    };\n    const chips = [ mkChip(\"all\", \"הכל\", \"#C9572E\", \"all\"),\n      ...order.map(name => mkChip(name, name, this.CATS[name].color, this.CATS[name].icon)) ];\n\n    // sections\n    const visible = this.state.data.filter(d => this.matches(d));\n    const cats = active === \"all\" ? order : [active];\n    const sections = [];\n    cats.forEach(cat => {\n      const cards = visible.filter(d => d.cat === cat).map(d => this.cardVM(d, density));\n      if(cards.length) sections.push({\n        label: cat, color: this.CATS[cat].color, desc: this.CATS[cat].desc,\n        tint: this.CATS[cat].tint, icon: this.icon(this.CATS[cat].icon, this.CATS[cat].color),\n        count: cards.length, cards\n      });\n    });\n\n    const isNarrow = this.state.isNarrow;\n    const mv = this.state.mobileView;\n    const listDisplay = (!isNarrow || mv === \"list\") ? \"block\" : \"none\";\n    const mapDisplay  = (!isNarrow || mv === \"map\")  ? \"block\" : \"none\";\n    const tabBase = \"flex:1;border:none;background:transparent;cursor:pointer;font-family:'Rubik',sans-serif;font-weight:600;font-size:14.5px;padding:9px;border-radius:9px;color:#5A6562\";\n    const tabOn   = \"flex:1;border:none;cursor:pointer;font-family:'Rubik',sans-serif;font-weight:600;font-size:14.5px;padding:9px;border-radius:9px;background:#20302E;color:#F3EEE2\";\n\n    return {\n      chips, sections,\n      hasResults: visible.length > 0,\n      noResults: visible.length === 0,\n      countLine: visible.length ? (visible.length + \" מקומות\") : \"\",\n      listGap: density === \"compact\" ? \"9px\" : \"12px\",\n      showMap,\n      gridCols: (showMap && !isNarrow) ? \"minmax(0,1.04fr) minmax(0,0.96fr)\" : \"minmax(0,1fr)\",\n      navTop: this.state.headerH + \"px\",\n      mapTop: isNarrow ? \"0px\" : (this.state.headerH + this.state.navH + 14) + \"px\",\n      toggleTop: (this.state.headerH + this.state.navH) + \"px\",\n      mapPosition: isNarrow ? \"relative\" : \"sticky\",\n      listDisplay, mapDisplay,\n      showToggle: isNarrow && showMap,\n      listTabStyle: mv === \"list\" ? tabOn : tabBase,\n      mapTabStyle:  mv === \"map\"  ? tabOn : tabBase,\n      setListView: () => this.setState({ mobileView:\"list\" }),\n      setMapView:  () => this.setState({ mobileView:\"map\" }),\n      onSearch: (e) => this.setState({ query: e.target.value, selected:null })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
