name: Notify on prediction issue

# כשנפתח issue (תחזית/שינוי) ע"י ה-Routine, הבוט משייך ומתייג את הבעלים.
# הבוט הוא שחקן אחר מהמשתמש, לכן ההתראה (מייל + פוש) כן נשלחת —
# בניגוד ל-issue שהמשתמש יוצר בעצמו, שעליו GitHub לא מתריע.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Assign and mention owner
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'BumbleBeeDream';
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [owner],
              });
            } catch (e) {
              core.warning(`assign failed: ${e.message}`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${owner} 🔔 **תחזית חדשה**\n\n${context.payload.issue.body || ''}`,
            });
